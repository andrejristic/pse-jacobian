[project]
name = "pse-jacobian"
version = "0.1.0"
description = "A PSE swarm that reproduces and audits a counterexample to the Jacobian Conjecture."
readme = "GUIDE_EN.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Andrej Ristic" }]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "sympy>=1.12", "numpy>=1.24", "matplotlib>=3.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pse_jacobian*"]

[tool.setuptools.package-data]
pse_jacobian = ["**/*.json", "**/*.txt", "**/*.csv"]
